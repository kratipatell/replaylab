app = "replaylab-engine"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  CACHE_DIR = "/data/cache"
  DB_PATH = "/data/runs.db"
  DEMO_MODE = "true"
  BINANCE_BASE_URL = "https://data-api.binance.vision"
  PREWARM = "BTCUSDT:1h:5"

[mounts]
  source = "replaylab_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
